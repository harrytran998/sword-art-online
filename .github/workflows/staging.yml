name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (defaults to latest)"
        required: false
        default: "latest"

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        run: |
          echo "Deploying ghcr.io/${{ github.repository }}/server:${{ github.event.inputs.image_tag }} to staging"
          # TODO: Add actual deployment commands (kubectl, docker compose, etc.)
          # kubectl set image deployment/game-server \
          #   game-server=ghcr.io/${{ github.repository }}/server:${{ github.event.inputs.image_tag }} \
          #   -n staging
