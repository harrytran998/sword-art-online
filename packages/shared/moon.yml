language: "javascript"
type: "library"

tasks:
  build:
    command: "tsdown"
    inputs:
      - "src/**/*.ts"
      - "tsdown.config.ts"
    outputs:
      - "dist"

  test:
    command: "bun test"
    inputs:
      - "src/**/*.ts"
      - "src/**/*.test.ts"
    options:
      allowFailure: true

  lint:
    command: "oxlint src/"
    inputs:
      - "src/**/*.ts"
      - "tsconfig.json"

  format:
    command: "oxfmt src/"
    inputs:
      - "src/**/*.ts"

  typecheck:
    command: "tsc --noEmit"
    inputs:
      - "src/**/*.ts"
      - "tsconfig.json"
