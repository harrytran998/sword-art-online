language: "javascript"
type: "library"

tasks:
  build:
    command: "bun build src/index.ts --outdir dist"
    inputs:
      - "src/**/*.ts"
    outputs:
      - "dist"

  test:
    command: "bun test"
    inputs:
      - "src/**/*.ts"
      - "src/**/*.test.ts"

  lint:
    command: "oxlint src/"
    inputs:
      - "src/**/*.ts"

  format:
    command: "oxfmt src/"
    inputs:
      - "src/**/*.ts"

  typecheck:
    command: "bun tsc --noEmit"
    inputs:
      - "src/**/*.ts"
      - "tsconfig.json"
