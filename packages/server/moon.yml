language: "javascript"
type: "application"

tasks:
  dev:
    command: "bun --watch src/index.ts"
    local: true

  build:
    command: "tsdown"
    deps:
      - "shared:build"
    inputs:
      - "src/**/*.ts"
      - "tsdown.config.ts"
    outputs:
      - "dist"

  test:
    command: "bun test"
    deps:
      - "shared:build"
    inputs:
      - "src/**/*.ts"
      - "src/**/*.test.ts"

  lint:
    command: "oxlint src/"
    inputs:
      - "src/**/*.ts"
      - "tsconfig.json"

  format:
    command: "oxfmt src/"
    inputs:
      - "src/**/*.ts"

  typecheck:
    command: "tsc --noEmit"
    deps:
      - "shared:build"
    inputs:
      - "src/**/*.ts"
      - "tsconfig.json"
